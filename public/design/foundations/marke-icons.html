<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Marke &amp; Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand-600:#3d6335;--brand-900:#22351f;--accent-400:#d3714a;--paper:#f7f4ee;--card:#fffdf9;--ink-100:#efeadf;--ink-400:#a49a85;--ink-700:#4a443a;--ink-900:#211d17;--shadow:0 1px 2px rgb(33 29 23/.04),0 4px 16px rgb(33 29 23/.06)}
*{box-sizing:border-box;margin:0}body{background:var(--paper);font-family:Inter,sans-serif;padding:24px;color:var(--ink-900)}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin:18px 0 10px}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--brand-600),var(--brand-900));display:grid;place-content:center;color:var(--paper);box-shadow:var(--shadow)}
.word{font-family:Fraunces,serif;font-size:26px;font-weight:600;letter-spacing:-.01em}
.icons{display:grid;grid-template-columns:repeat(6,56px);gap:8px}
.ic{height:56px;border-radius:14px;background:var(--card);border:1px solid var(--ink-100);display:grid;place-content:center;color:var(--ink-700)}
p.note{font-size:12px;color:var(--ink-400);margin-top:12px;max-width:380px;line-height:1.5}
</style></head><body>

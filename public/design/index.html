<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rezeptbase Design-System</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand-600:#3d6335;--brand-900:#22351f;--paper:#f7f4ee;--card:#fffdf9;--ink-100:#efeadf;--ink-400:#a49a85;--ink-500:#7c745f;--ink-900:#211d17;--shadow:0 1px 2px rgb(33 29 23/.04),0 4px 16px rgb(33 29 23/.06)}
*{box-sizing:border-box;margin:0}body{background:var(--paper);font-family:Inter,sans-serif;color:var(--ink-900);padding:32px;max-width:900px;margin:0 auto}
h1{font-family:Fraunces,serif;font-size:32px;font-weight:600;letter-spacing:-.01em}
p.sub{color:var(--ink-500);margin:6px 0 28px}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--card);border:1px solid var(--ink-100);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s}
a.card:hover{transform:translateY(-2px)}
a.card iframe{width:200%;height:360px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none;display:block}
a.card .cap{padding:12px 16px;font-weight:600;font-size:14px;border-top:1px solid var(--ink-100)}
</style></head><body>

<!-- @dsCard group="Komponenten" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Formulare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand-100:#e0eadb;--brand-500:#517d45;--brand-600:#3d6335;--paper:#f7f4ee;--card:#fffdf9;--ink-200:#e5dfd2;--ink-300:#cfc7b4;--ink-400:#a49a85;--ink-500:#7c745f;--ink-900:#211d17}
*{box-sizing:border-box;margin:0}body{background:var(--paper);font-family:Inter,sans-serif;padding:24px;color:var(--ink-900);max-width:420px}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin:18px 0 8px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-400)}
.search input{width:100%;border:1px solid var(--ink-200);background:var(--card);border-radius:16px;padding:12px 16px 12px 42px;font:inherit;font-size:14px;outline:none}
input.txt{width:100%;border:1px solid var(--ink-200);background:var(--card);border-radius:12px;padding:12px 16px;font:inherit;font-size:15px;outline:none}
input.focus{border-color:var(--brand-500);box-shadow:0 0 0 4px var(--brand-100)}
.check{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:15px;color:#4a443a}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-300);background:var(--card)}
.box.on{background:var(--brand-600);border-color:var(--brand-600);display:grid;place-content:center}
.box.on::before{content:"";width:10px;height:10px;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%)}
.slider{display:flex;align-items:center;gap:12px}
.track{flex:1;height:6px;border-radius:999px;background:var(--ink-200);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:999px;background:var(--brand-600)}
.thumb{position:absolute;left:40%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:999px;background:var(--brand-600);border:4px solid var(--card);box-shadow:0 1px 4px rgb(33 29 23/.25)}
.round{width:40px;height:40px;border-radius:999px;border:1px solid var(--ink-200);background:var(--card);display:grid;place-content:center;color:#4a443a;font-size:18px}
</style></head><body>
<p class="label" style="margin-top:0">Suche</p>
<div class="search">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<input placeholder="Suche nach Titel oder Zutat …">
</div>
<p class="label">Eingabefelder (normal / fokussiert)</p>
<input class="txt" placeholder="https://…" style="margin-bottom:10px">
<input class="txt focus" value="Original Butter Chicken">
<p class="label">Zutaten-Checkliste</p>
<div class="check"><span class="box on"></span><span style="text-decoration:line-through;color:var(--ink-400)"><b>300 g</b> Hähnchenfleisch</span></div>
<div class="check"><span class="box"></span><span><b style="color:var(--ink-900)">2 Stück</b> Knoblauchzehen</span></div>
<div class="check"><span class="box"></span><span><b style="color:var(--ink-900)">1,5 EL</b> Olivenöl</span></div>
<p class="label">Portionen-Slider</p>
<div class="slider">
<span class="round">−</span>
<div class="track"><div class="fill"></div><div class="thumb"></div></div>
<span class="round">+</span>
</div>
</body></html>

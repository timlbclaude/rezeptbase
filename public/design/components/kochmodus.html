<!-- @dsCard group="Komponenten" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kochmodus</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand-600:#3d6335;--brand-700:#314f2c;--paper:#f7f4ee;--card:#fffdf9;--ink-200:#e5dfd2;--ink-500:#7c745f;--ink-700:#4a443a;--ink-900:#211d17;--shadow:0 1px 2px rgb(33 29 23/.04),0 4px 16px rgb(33 29 23/.06)}
*{box-sizing:border-box;margin:0}body{background:var(--paper);font-family:Inter,sans-serif;color:var(--ink-900)}
.phone{width:340px;height:560px;margin:24px auto;border:1px solid var(--ink-200);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;font-size:13px;font-weight:600;color:var(--ink-500)}
.bar{margin:0 16px;height:6px;border-radius:999px;background:var(--ink-200);overflow:hidden}
.bar div{width:42%;height:100%;background:var(--brand-600);border-radius:999px}
.mid{flex:1;padding:28px 24px}
.nr{width:48px;height:48px;border-radius:16px;background:var(--brand-700);color:var(--paper);display:grid;place-content:center;font-family:Fraunces,serif;font-size:20px;font-weight:600;margin-bottom:22px}
.step{font-size:21px;line-height:1.55}
.nav{display:flex;gap:12px;padding:12px 16px 22px}
.nav .b1{flex:1;border:1px solid var(--ink-200);background:var(--card);border-radius:16px;padding:15px;text-align:center;font-weight:600;color:var(--ink-700);font-size:15px}
.nav .b2{flex:2;background:var(--brand-700);color:var(--paper);border-radius:16px;padding:15px;text-align:center;font-weight:600;font-size:15px;box-shadow:var(--shadow)}
</style></head><body>
<div class="phone">
  <div class="top"><span>✕ Beenden</span><span>Schritt 5 von 12</span><span>Zutaten</span></div>
  <div class="bar"><div></div></div>
  <div class="mid">
    <div class="nr">5</div>
    <p class="step">Knoblauch-Ingwer-Paste, Gewürze und die Cashewnüsse dazugeben und weitere 30–40 Sekunden mit anschwitzen.</p>
  </div>
  <div class="nav"><div class="b1">‹ Zurück</div><div class="b2">Weiter ›</div></div>
</div>
</body></html>
